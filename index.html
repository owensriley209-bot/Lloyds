.hm-mc{display:flex;align-items:center;gap:20px;padding:22px 20px}
.hm-mi{width:72px;height:56px;border-radius:12px;background:#6ef07c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.hm-sub{color:#b5b5b5;font-size:16px;margin-top:6px}
.hm-ch{margin-left:auto}
.tabs{background:#141414;border-top:0}

body{font-weight:400;letter-spacing:.005em}
.hm{padding:0 16px 8px}
.hm-w{gap:18px;padding:14px 0 12px;font-size:22px}
.hm-w b{font-weight:500}
.hm-p{gap:12px;margin:8px 0 22px}
.hm-pill{width:102px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:12px;font-weight:400}
.hm-pill.on{font-weight:400}
.hm-h{font-size:22px;font-weight:500;margin:0 0 14px}
.hm-card{border-radius:20px;margin-bottom:16px}
.hm-top{padding:12px 16px 14px}
.hm-top .owner b{font-size:16px;font-weight:500}
.hm-top .owner span{font-size:13px}
.hm-dots{font-size:14px;margin:-2px 2px 0 0;line-height:1}
.hm-bal{font-size:28px;font-weight:400;margin-top:14px}.hm-bal small{font-size:20px}
.hm-acts button{padding:0;height:54px;font-size:17px;font-weight:600}
.hm-help{padding-top:6px}
.hm-ill{display:block;width:150px;height:84px;margin:6px auto 14px}
.hm-help h3{font-size:19px;font-weight:600}
.hm-help p{font-size:16px;font-weight:300;margin:10px 20px 14px;color:#c4c4c4}
.hm-help button{height:57px;padding:0 20px;font-size:17px;font-weight:300}
.hm-mc{padding:14px 16px;gap:16px;margin-bottom:12px}
.hm-mi{width:62px;height:48px}
.hm-sub{font-size:15px;font-weight:300;color:#c4c4c4;margin-top:4px}
.tabs button{font-size:12px;font-weight:400}

.hm-w{font-size:20px}
.hm-pill{font-size:15px}
.hm-h{font-size:19px}
.hm-top .owner b{font-size:15px}
.hm-top .owner span{font-size:12px}
.hm-bal{font-size:25px}.hm-bal small{font-size:18px}
.hm-acts button{font-size:15px}
.hm-help h3{font-size:17px}
.hm-help p{font-size:14px}
.hm-help button{font-size:15px}
.hm-mc div div:first-child{font-size:15px!important}
.hm-sub{font-size:13px}
.tabs button{font-size:11px}

.blue,.pill.on,.sm-pill.on,.d2btn.rdy,.np-btn.rdy,.hm-pill.on,.plus{color:#04210f!important}
.d2m i{color:#04210f!important}
.tabs{background:#141414}
.lock{background:linear-gradient(180deg,#14803a,#0a4a22)}
.sm,.hm,.d2,.np-h{background:#141414}
.np,.sm-r,.sm-f,.sm-h{background:#222}
.sm-h,.dh,.letter{background:#222}
.card,.menu,.pbox,.d2c,.hm-card,.acct,.help,.fc,.ok{background:#222!important}
.search,.srch,.fld,.srch{background:#1a1a1a}
.act4 button,.circ i,.tx .av,.ava,.req .in{background:#2a2a2a}
.mtabs,.bar{border-color:#3a3a3a}
.d2btn,.np-btn,.d2btn.rdy,.np-btn.rdy,.blue{background:var(--blue)!important;color:#000!important}

.tabs{position:relative;flex-wrap:wrap;background:#141414;border-top:2px solid #222;padding:0 0 0;height:auto}
.tabs button{flex:1 1 20%;padding:10px 0 4px;gap:4px;font-size:12px;color:#fff;font-weight:500;align-items:center}
.tabs button i{display:flex;height:28px;font-size:0}
.tabs button.on{color:#13e05a;font-weight:700}
.tabs button.on::before{height:4px;top:-2px;background:#13e05a}
.hbar{flex:0 0 100%;height:22px;display:flex;justify-content:center;align-items:center}

.h2{--s:calc(min(100vw,460px)/1080);background:#141414;min-height:100%;box-sizing:border-box;padding:0 calc(42*var(--s)) calc(60*var(--s));font-family:'MONT',Montserrat,Poppins,Roboto,sans-serif;color:#fff;letter-spacing:0;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:where(.h2) button{font-family:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(.h2) *{box-sizing:border-box}
.h2 button{-webkit-tap-highlight-color:transparent;outline:none!important;user-select:none;-webkit-user-select:none}
.h2-w{display:flex;align-items:center;height:calc(100*var(--s))}
.h2-w .in{width:calc(72*var(--s));height:calc(67*var(--s));margin-left:calc(-2*var(--s));display:block;mix-blend-mode:normal}
.h2-w b{flex:1;margin-left:calc(48*var(--s));font-size:calc(47.3*var(--s));font-weight:600;white-space:nowrap;letter-spacing:0}
.h2-w .pf{width:calc(74*var(--s));height:calc(74*var(--s));display:block;mix-blend-mode:normal;margin-right:calc(-6*var(--s))}
.h2-w button{display:flex}
.h2-p{display:flex;gap:calc(34*var(--s));margin-top:calc(65*var(--s))}
.h2-pill{width:calc(269*var(--s));height:calc(93*var(--s));border:calc(3*var(--s)) solid #4a4a4a;border-radius:calc(32*var(--s));font-size:calc(37.0*var(--s));font-weight:400;display:flex;align-items:center;justify-content:center}
.h2-pill.on{background:#13e05a;color:#04210f!important;width:calc(268*var(--s))}
.h2-h{font-size:calc(46.4*var(--s));font-weight:600;margin:calc(60*var(--s)) 0 calc(44*var(--s));line-height:calc(60*var(--s));letter-spacing:0}
.h2-c{background:#222;border-radius:calc(58*var(--s));overflow:hidden;margin-bottom:calc(42*var(--s));display:block;width:100%;position:relative}
.h2-top{display:block;width:100%;text-align:left;min-height:calc(296*var(--s));padding:calc(40*var(--s)) calc(43*var(--s)) 0;position:relative}
.h2-dots{position:absolute;right:calc(33*var(--s));top:calc(56*var(--s));width:calc(58*var(--s));height:calc(14*var(--s))}
.h2-dots svg{display:block;width:100%;height:100%}
.h2-top .nm{font-size:calc(39.6*var(--s));font-weight:600;line-height:calc(56*var(--s))}
.h2-top .no{font-size:calc(36.1*var(--s));font-weight:400;color:#b5b5b5;line-height:calc(56*var(--s));margin-top:calc(2*var(--s))}
.h2-bal{font-size:calc(60.2*var(--s));font-weight:500;margin-top:calc(16*var(--s));line-height:calc(100*var(--s));letter-spacing:0}
.h2-bal small{font-size:calc(46.4*var(--s))}
.h2-acts{display:grid;grid-template-columns:1fr 1fr;border-top:calc(2*var(--s)) solid #3a3a3a;height:calc(144*var(--s))}
.h2-acts button{text-align:center;font-size:calc(37.8*var(--s));font-weight:700}
.h2-acts button+button{border-left:calc(2*var(--s)) solid #3a3a3a}
.h2-hp{text-align:center;padding-top:calc(50*var(--s))}

function cbNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}

function cbPush(title,body){

  return Promise.race([navigator.serviceWorker.ready,new Promise(function(_,j){setTimeout(j,2500)})]).then(function(r){

}

 const q=t.toLowerCase(),st=S.cs;S.cs='';
